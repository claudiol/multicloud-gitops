---
global:
  pattern: multicloud-gitops
  singleArgoCD: true
  options:
    useCSV: false
    syncPolicy: Automatic
    installPlanApproval: Automatic
#
# Needed to ensure that the ACM instance is not managed.
# We will be using the ACM Global Hub to manage the 
# ACM in this pattern.
acm:
  mch_spec:
    disableHubSelfManagement: true
main:
  variant: hub
  multiSourceConfig:
    enabled: true
    clusterGroupChartVersion: "0.9.*"
